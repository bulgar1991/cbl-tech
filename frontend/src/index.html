<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CBL Tech</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="We build fast, beautiful and modern digital products — with a touch of neon."
    />
    <link href="favicon.ico" rel="icon" />
    <link href="site.webmanifest" rel="manifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root>
      <!-- Shown until Angular boots; <app-page-loader> then takes over with the same markup. -->
      <div class="page-loader" role="status" data-testid="page-loader">
        <span class="page-loader__logo text-gradient">CBL Tech</span>
        <span class="page-loader__spinner" aria-hidden="true"></span>
        <span class="sr-only">Loading…</span>
      </div>
    </app-root>
  </body>
</html>
