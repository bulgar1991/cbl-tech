<header
  data-testid="site-header"
  class="fixed inset-x-0 top-0 z-50 transition-all duration-500"
  [class.bg-background/90]="scrolled()"
  [class.shadow-glow]="scrolled()"
>
  <nav class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4">
    <a
      class="text-gradient font-display text-2xl font-bold transition-transform hover:scale-110"
      routerLink="/"
    >
      {{ siteName }}
    </a>

    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.id) {
        <li>
          <a
            class="link-underline text-ink-muted transition-colors hover:text-white"
            routerLinkActive="!text-white"
            [routerLinkActiveOptions]="{ exact: link.link === '/' }"
            [routerLink]="link.link"
            [attr.data-testid]="'nav-link-' + link.id"
          >
            {{ link.label }}
          </a>
        </li>
      }
      <li><a class="btn btn-primary px-5 py-2 text-sm" routerLink="/contact">Get started</a></li>
    </ul>

    <button
      class="flex h-10 w-10 flex-col items-center justify-center gap-1.5 md:hidden"
      type="button"
      aria-label="Menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span
        class="h-0.5 w-6 bg-white transition-transform duration-300"
        [class.translate-y-2]="menuOpen()"
        [class.rotate-45]="menuOpen()"
      ></span>
      <span
        class="h-0.5 w-6 bg-white transition-opacity duration-300"
        [class.opacity-0]="menuOpen()"
      ></span>
      <span
        class="h-0.5 w-6 bg-white transition-transform duration-300"
        [class.-translate-y-2]="menuOpen()"
        [class.-rotate-45]="menuOpen()"
      ></span>
    </button>
  </nav>

  @if (menuOpen()) {
    <ul class="animate-fade-in border-t border-border bg-background px-4 py-6 md:hidden">
      @for (link of links; track link.id) {
        <li>
          <a
            class="block py-3 text-lg text-ink-muted hover:text-white"
            routerLinkActive="!text-white"
            [routerLinkActiveOptions]="{ exact: link.link === '/' }"
            [routerLink]="link.link"
            (click)="menuOpen.set(false)"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  }
</header>
