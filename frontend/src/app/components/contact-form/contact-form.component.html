@if (status() === 'success') {
  <div class="card animate-fade-up text-center" data-testid="contact-success">
    <h3 class="text-gradient font-display text-2xl font-bold">
      {{ 'contactForm.success.title' | translate }}
    </h3>
    <p class="mt-2 text-ink-muted">{{ 'contactForm.success.text' | translate }}</p>
    <button class="btn btn-outline mt-6" type="button" (click)="reset()">
      {{ 'contactForm.success.again' | translate }}
    </button>
  </div>
} @else {
  <form
    class="card grid gap-5 sm:grid-cols-2"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
    data-testid="contact-form"
  >
    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.firstName' | translate }} *</span>
      <input
        class="input"
        formControlName="firstName"
        autocomplete="given-name"
        [placeholder]="'contactForm.placeholders.firstName' | translate"
      />
      @if (showError('firstName')) {
        <span class="text-sm text-danger">{{ 'contactForm.errors.firstName' | translate }}</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.lastName' | translate }} *</span>
      <input
        class="input"
        formControlName="lastName"
        autocomplete="family-name"
        [placeholder]="'contactForm.placeholders.lastName' | translate"
      />
      @if (showError('lastName')) {
        <span class="text-sm text-danger">{{ 'contactForm.errors.lastName' | translate }}</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.company' | translate }}</span>
      <input
        class="input"
        formControlName="company"
        autocomplete="organization"
        [placeholder]="'contactForm.placeholders.company' | translate"
      />
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.jobTitle' | translate }}</span>
      <input
        class="input"
        formControlName="jobTitle"
        autocomplete="organization-title"
        [placeholder]="'contactForm.placeholders.jobTitle' | translate"
      />
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.email' | translate }} *</span>
      <input
        class="input"
        formControlName="email"
        type="email"
        autocomplete="email"
        [placeholder]="'contactForm.placeholders.email' | translate"
      />
      @if (showError('email')) {
        <span class="text-sm text-danger">{{ 'contactForm.errors.email' | translate }}</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.phone' | translate }}</span>
      <input
        class="input"
        formControlName="phone"
        type="tel"
        autocomplete="tel"
        [placeholder]="'contactForm.placeholders.phone' | translate"
      />
      @if (showError('phone')) {
        <span class="text-sm text-danger">{{ 'contactForm.errors.phone' | translate }}</span>
      }
    </label>

    <label class="grid gap-2 sm:col-span-2">
      <span class="text-sm text-ink-muted">{{ 'contactForm.labels.project' | translate }} *</span>
      <textarea
        class="input min-h-36 resize-y"
        formControlName="project"
        [placeholder]="'contactForm.placeholders.project' | translate"
      ></textarea>
      @if (showError('project')) {
        <span class="text-sm text-danger">{{ 'contactForm.errors.project' | translate }}</span>
      }
    </label>

    <!-- Honeypot -->
    <input
      class="hidden"
      type="checkbox"
      formControlName="botcheck"
      tabindex="-1"
      autocomplete="off"
    />

    <div class="flex flex-wrap items-center gap-4 sm:col-span-2">
      <button
        class="btn btn-primary"
        type="submit"
        appMagnetic
        [disabled]="status() === 'sending'"
        data-testid="contact-submit"
      >
        @if (status() === 'sending') {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
          ></span>
          {{ 'contactForm.sending' | translate }}
        } @else {
          {{ 'contactForm.submit' | translate }}
        }
      </button>
      @if (status() === 'error') {
        <span class="text-sm text-danger">{{ 'contactForm.error' | translate }}</span>
      }
    </div>
  </form>
}
