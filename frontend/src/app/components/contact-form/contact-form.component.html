@if (status() === 'success') {
  <div class="card animate-fade-up text-center">
    <h3 class="text-gradient font-display text-2xl font-bold">Message sent!</h3>
    <p class="mt-2 text-ink-muted">Thanks, we will get back to you soon.</p>
    <button class="btn btn-outline mt-6" type="button" (click)="reset()">Send another</button>
  </div>
} @else {
  <form class="card grid gap-5 sm:grid-cols-2" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Name</span>
      <input class="input" formControlName="name" autocomplete="name" placeholder="John Doe" />
      @if (showError('name')) {
        <span class="text-sm text-danger">Please enter your name.</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Email</span>
      <input
        class="input"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="john@example.com"
      />
      @if (showError('email')) {
        <span class="text-sm text-danger">Please enter a valid email.</span>
      }
    </label>

    <label class="grid gap-2 sm:col-span-2">
      <span class="text-sm text-ink-muted">Subject</span>
      <input class="input" formControlName="subject" placeholder="How can we help?" />
      @if (showError('subject')) {
        <span class="text-sm text-danger">Please enter a subject.</span>
      }
    </label>

    <label class="grid gap-2 sm:col-span-2">
      <span class="text-sm text-ink-muted">Message</span>
      <textarea
        class="input min-h-36 resize-y"
        formControlName="message"
        placeholder="Tell us about your project…"
      ></textarea>
      @if (showError('message')) {
        <span class="text-sm text-danger">Please write at least 10 characters.</span>
      }
    </label>

    <!-- Honeypot -->
    <input
      class="hidden"
      type="checkbox"
      formControlName="botcheck"
      tabindex="-1"
      autocomplete="off"
    />

    <div class="flex flex-wrap items-center gap-4 sm:col-span-2">
      <button class="btn btn-primary" type="submit" appMagnetic [disabled]="status() === 'sending'">
        @if (status() === 'sending') {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
          ></span>
          Sending…
        } @else {
          Send message
        }
      </button>
      @if (status() === 'error') {
        <span class="text-sm text-danger">Something went wrong, please try again.</span>
      }
    </div>
  </form>
}
