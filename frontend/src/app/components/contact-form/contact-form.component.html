@if (status() === 'success') {
  <div class="card animate-fade-up text-center" data-testid="contact-success">
    <h3 class="text-gradient font-display text-2xl font-bold">Message sent!</h3>
    <p class="mt-2 text-ink-muted">Thanks, we will get back to you soon.</p>
    <button class="btn btn-outline mt-6" type="button" (click)="reset()">Send another</button>
  </div>
} @else {
  <form
    class="card grid gap-5 sm:grid-cols-2"
    [formGroup]="form"
    (ngSubmit)="submit()"
    novalidate
    data-testid="contact-form"
  >
    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">First name *</span>
      <input
        class="input"
        formControlName="firstName"
        autocomplete="given-name"
        placeholder="John"
      />
      @if (showError('firstName')) {
        <span class="text-sm text-danger">Please enter your first name.</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Last name *</span>
      <input
        class="input"
        formControlName="lastName"
        autocomplete="family-name"
        placeholder="Doe"
      />
      @if (showError('lastName')) {
        <span class="text-sm text-danger">Please enter your last name.</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Company name</span>
      <input
        class="input"
        formControlName="company"
        autocomplete="organization"
        placeholder="Acme Inc."
      />
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Job title</span>
      <input
        class="input"
        formControlName="jobTitle"
        autocomplete="organization-title"
        placeholder="Product manager"
      />
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Email *</span>
      <input
        class="input"
        formControlName="email"
        type="email"
        autocomplete="email"
        placeholder="john@example.com"
      />
      @if (showError('email')) {
        <span class="text-sm text-danger">Please enter a valid email.</span>
      }
    </label>

    <label class="grid gap-2">
      <span class="text-sm text-ink-muted">Mobile phone number</span>
      <input
        class="input"
        formControlName="phone"
        type="tel"
        autocomplete="tel"
        placeholder="+1 555 123 4567"
      />
      @if (showError('phone')) {
        <span class="text-sm text-danger">Please enter a valid phone number.</span>
      }
    </label>

    <label class="grid gap-2 sm:col-span-2">
      <span class="text-sm text-ink-muted">Project details *</span>
      <textarea
        class="input min-h-36 resize-y"
        formControlName="project"
        placeholder="Goals, timeline, budget, links… anything useful about your project."
      ></textarea>
      @if (showError('project')) {
        <span class="text-sm text-danger">Please write at least 10 characters.</span>
      }
    </label>

    <!-- Honeypot -->
    <input
      class="hidden"
      type="checkbox"
      formControlName="botcheck"
      tabindex="-1"
      autocomplete="off"
    />

    <div class="flex flex-wrap items-center gap-4 sm:col-span-2">
      <button
        class="btn btn-primary"
        type="submit"
        appMagnetic
        [disabled]="status() === 'sending'"
        data-testid="contact-submit"
      >
        @if (status() === 'sending') {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-white border-t-transparent"
          ></span>
          Sending…
        } @else {
          Submit
        }
      </button>
      @if (status() === 'error') {
        <span class="text-sm text-danger">Something went wrong, please try again.</span>
      }
    </div>
  </form>
}
