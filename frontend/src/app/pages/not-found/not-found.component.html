<section
  class="relative flex min-h-screen items-center justify-center overflow-hidden px-4 text-center"
  data-testid="not-found"
>
  <div class="blob left-[20%] top-[20%] text-primary"></div>
  <div class="blob bottom-[15%] right-[20%] text-violet [animation-delay:-5s]"></div>

  <div class="relative z-10">
    <p class="text-gradient animate-fade-up font-display text-8xl font-bold md:text-9xl">404</p>
    <h1 class="mt-4 animate-fade-up font-display text-3xl font-bold [animation-delay:150ms]">
      {{ 'pages.notFound.title' | translate }}
    </h1>
    <p class="mt-4 animate-fade-up text-ink-muted [animation-delay:300ms]">
      {{ 'pages.notFound.text' | translate }}
    </p>
    <a
      class="btn btn-primary mt-10 animate-fade-up [animation-delay:450ms]"
      routerLink="/"
      appMagnetic
    >
      {{ 'pages.notFound.back' | translate }}
    </a>
  </div>
</section>
