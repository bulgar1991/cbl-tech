<app-page-header
  [title]="service().key + '.title' | translate"
  [subtitle]="service().key + '.summary' | translate"
  [parent]="{ label: 'pages.services.title' | translate, link: '/services' }"
/>

<section class="mx-auto max-w-3xl px-4 pb-24 pt-8">
  <div class="card" appReveal>
    <p class="text-lg leading-relaxed text-ink-muted">
      {{ service().key + '.description' | translate }}
    </p>

    <h2 class="mt-8 font-display text-xl font-semibold">{{ 'services.included' | translate }}</h2>
    <ul class="mt-4 grid gap-3">
      @for (point of points(); track point) {
        <li class="flex items-start gap-3 text-ink-muted">
          <span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-gradient-primary"></span>
          {{ point }}
        </li>
      }
    </ul>
  </div>

  <div class="mt-10 flex flex-wrap justify-center gap-4" appReveal [revealDelay]="100">
    <a class="btn btn-primary" routerLink="/contact" appMagnetic>{{
      'services.startProject' | translate
    }}</a>
    <a class="btn btn-outline" routerLink="/services" appMagnetic>{{
      'services.all' | translate
    }}</a>
  </div>
</section>
