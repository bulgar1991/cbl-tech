<app-page-header
  [title]="service().title"
  [subtitle]="service().summary"
  [parent]="{ label: 'Services', link: '/services' }"
/>

<section class="mx-auto max-w-3xl px-4 pb-24 pt-8">
  <div class="card" appReveal>
    <p class="text-lg leading-relaxed text-ink-muted">{{ service().description }}</p>

    <h2 class="mt-8 font-display text-xl font-semibold">What's included</h2>
    <ul class="mt-4 grid gap-3">
      @for (point of service().points; track point) {
        <li class="flex items-start gap-3 text-ink-muted">
          <span class="mt-2 h-2 w-2 shrink-0 rounded-full bg-gradient-primary"></span>
          {{ point }}
        </li>
      }
    </ul>
  </div>

  <div class="mt-10 flex flex-wrap justify-center gap-4" appReveal [revealDelay]="100">
    <a class="btn btn-primary" routerLink="/contact" appMagnetic>Start a project</a>
    <a class="btn btn-outline" routerLink="/services" appMagnetic>All services</a>
  </div>
</section>
