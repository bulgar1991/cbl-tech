<app-page-header
  [title]="'pages.services.title' | translate"
  [subtitle]="'pages.services.subtitle' | translate"
/>

<section class="mx-auto max-w-6xl px-4 pb-24 pt-8">
  <div class="grid gap-6 sm:grid-cols-2">
    @for (service of services; track service.id; let i = $index) {
      <div appReveal [revealDelay]="i * 100">
        <a
          class="card spotlight group block h-full no-underline"
          appTilt
          [routerLink]="['/services', service.id]"
          [attr.data-testid]="'service-card-' + service.id"
        >
          <div
            class="flex h-14 w-14 items-center justify-center rounded-xl bg-gradient-primary text-2xl shadow-glow transition-transform duration-500 group-hover:rotate-12 group-hover:scale-110"
          >
            {{ service.icon }}
          </div>
          <h2
            class="mt-5 font-display text-2xl font-semibold transition-colors group-hover:text-azure"
          >
            {{ service.key + '.title' | translate }}
          </h2>
          <p class="mt-2 text-ink-muted">{{ service.key + '.summary' | translate }}</p>
          <span class="mt-4 inline-block text-sm font-semibold text-azure">{{
            'services.learnMore' | translate
          }}</span>
        </a>
      </div>
    }
  </div>
</section>
